name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish idle-screen.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/index.html idle-screen.html
          gh release create "$GITHUB_REF_NAME" idle-screen.html --generate-notes
